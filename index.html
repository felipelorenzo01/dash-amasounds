<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jingle Jangle · Ama Sounds</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo-ama.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Grenze+Gotisch:wght@600;800&display=swap">
<style>
/* Layout: one 1180px column on the Jingle Jangle night sky. Poster-style hero (title, red ribbons, countdown, tilted poster, Ama foliage in the corners), then period controls, audience tabs, KPI grid, chart + campaign funnel, pixel funnel, audience, comparison table, creatives. Single dark look on purpose. */
:root{
  --bg:#0a0f24; --card:#111a3d; --card2:#17214c; --line:rgba(233,180,76,.22);
  --gold:#e9b44c; --orange:#f2722b; --red:#c9302c; --cream:#f4e8cf; --muted:#b3aec6; --lime:#c6d72a;
  --accent:#e9b44c; --accent-ink:#1a1206;
  --fill1-bg:linear-gradient(160deg,#f2c35e,#e0862b); --fill1-ink:#1b1106; --fill1-cap:rgba(27,17,6,.74);
  --bar:#f2722b; --lineC:#e9b44c; --good:#86d694; --bad:#ff8f80; --grid:rgba(244,232,207,.08);
  --f-display:"Grenze Gotisch","UnifrakturCook",Georgia,serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.caps{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.22em;font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}


/* top strip */
.strip{border-bottom:1px solid var(--line)}
.strip .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px;font-size:12px}
.strip .l{color:var(--cream)}
.strip .r{display:flex;align-items:center;gap:14px;color:var(--muted)}
.flags{display:flex;gap:6px}
.flags button{width:30px;height:21px;padding:0;border:1px solid transparent;border-radius:3px;overflow:hidden;cursor:pointer;opacity:.55;background:none;transition:opacity .15s}
.flags button svg{display:block;width:100%;height:100%}
.flags button[aria-pressed="true"]{opacity:1;border-color:var(--gold);box-shadow:0 0 0 2px rgba(233,180,76,.25)}
.flags button:hover{opacity:.9}

/* hero */
.hero{position:relative;overflow:hidden;isolation:isolate;
  background:
   radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.8),transparent 60%),
   radial-gradient(1px 1px at 33% 72%,rgba(255,255,255,.6),transparent 60%),
   radial-gradient(1.5px 1.5px at 58% 12%,rgba(255,255,255,.7),transparent 60%),
   radial-gradient(1px 1px at 76% 44%,rgba(255,255,255,.6),transparent 60%),
   radial-gradient(1px 1px at 88% 82%,rgba(255,255,255,.7),transparent 60%),
   radial-gradient(1px 1px at 46% 38%,rgba(255,255,255,.5),transparent 60%),
   radial-gradient(1.5px 1.5px at 22% 52%,rgba(255,255,255,.5),transparent 60%),
   radial-gradient(1px 1px at 66% 64%,rgba(255,255,255,.5),transparent 60%),
   radial-gradient(120% 60% at 50% 120%,rgba(201,48,44,.45),transparent 60%),
   radial-gradient(80% 80% at 30% 0%,#1a2457,transparent 70%),
   var(--bg)}
.leaf{position:absolute;z-index:-1;pointer-events:none;filter:brightness(.5) saturate(.85);opacity:.9}
.leaf.bl{left:0;bottom:0;width:min(34vw,330px);-webkit-mask-image:radial-gradient(circle at 0 100%,#000 35%,transparent 72%);mask-image:radial-gradient(circle at 0 100%,#000 35%,transparent 72%)}
.leaf.tr{right:0;top:0;width:min(30vw,300px);-webkit-mask-image:radial-gradient(circle at 100% 0,#000 35%,transparent 72%);mask-image:radial-gradient(circle at 100% 0,#000 35%,transparent 72%)}
.tex{position:absolute;left:0;right:0;white-space:nowrap;overflow:hidden;font-family:var(--f-num);font-size:11px;letter-spacing:.32em;color:var(--lime);opacity:.13;pointer-events:none;z-index:-1}
.tex.t{top:8px}.tex.b{bottom:8px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:32px;align-items:center;padding-block:40px 46px}
.sig{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sig img{width:150px;height:auto}
.sig span{font-size:11px;color:var(--muted);letter-spacing:.24em}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(54px,8.6vw,108px);line-height:.86;margin:18px 0 6px;letter-spacing:.01em;
  background:linear-gradient(180deg,#ffd27a 0%,var(--gold) 38%,var(--orange) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.hero .sub{font-family:var(--f-display);font-weight:600;color:var(--gold);font-size:clamp(20px,2.6vw,28px);letter-spacing:.06em}
.ribbons{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 20px}
.ribbon{background:var(--red);color:#fff;font-family:var(--f-num);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:7px 20px;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);outline:1.5px solid rgba(255,240,220,.75);outline-offset:-5px}
.count{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.count .big{font-family:var(--f-num);font-weight:700;font-size:clamp(34px,4.6vw,52px);color:var(--cream);line-height:1}
.count .lbl{font-size:12px;color:var(--muted)}
.obj{margin-top:14px;font-size:17px;color:var(--cream);max-width:38ch}
.poster{justify-self:center;position:relative;width:min(100%,330px)}
.poster .frame{transform:rotate(4deg);border:1px solid var(--gold);padding:7px;background:rgba(10,15,36,.6);box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 4px rgba(233,180,76,.08)}
.poster img{display:block;width:100%}
.star{position:absolute;fill:var(--gold);pointer-events:none}

/* status + period */
.status .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:16px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;padding:4px 12px;background:var(--red);color:#fff;border-radius:2px}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.status small{color:var(--muted);font-size:13px}
.period .wrap{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center;padding-block:16px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg .lab{font-size:11px;color:var(--muted);margin-right:4px}
.seg button{background:var(--card);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:6px 11px;cursor:pointer;font-family:var(--f-num);font-weight:600;letter-spacing:.06em;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
select,input[type=date]{background:var(--card);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:6px 8px;font-family:var(--f-num);font-size:14px}
.custom{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:6px}
.tab{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 14px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,transform .15s}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent);background:var(--card2)}
.tab .code{align-self:flex-start;font-family:var(--f-num);font-weight:700;font-size:11px;letter-spacing:.14em;padding:2px 7px;border:1px solid var(--red);color:#ffb3a8;border-radius:2px}
.tab[aria-selected="true"] .code{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .nm{font-weight:600;font-size:16px}
.tab .sb{font-size:12.5px;color:var(--muted);min-height:2.5em}
.tab .res{font-family:var(--f-num);font-size:26px;font-weight:700;color:var(--gold);line-height:1}
.tab .cost{font-size:12.5px;color:var(--muted)}

/* section heads */
.sec{margin-top:34px}
.ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.ttl h2{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,3.6vw,40px);color:var(--gold);margin:0;line-height:1}
.ttl .tag{font-family:var(--f-num);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;padding:3px 10px;background:var(--red);color:#fff;border-radius:2px}
.ttl .per{flex-basis:100%;color:var(--muted);font-size:13px}
h3{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.2em;font-weight:700;font-size:14px;color:var(--cream);margin:0}
.h3sub{color:var(--muted);font-size:13px;margin:4px 0 0}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .k{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:600;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:clamp(28px,3.2vw,38px);line-height:1.05;color:var(--gold)}
.kpi .c{font-size:12.5px;color:var(--muted)}
.kpi .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi.fill{background:var(--fill1-bg);border-color:transparent}
.kpi.fill .k,.kpi.fill .c{color:var(--fill1-cap)}
.kpi.fill .v{color:var(--fill1-ink)}
.delta{font-family:var(--f-num);font-weight:700;font-size:13px;padding:1px 7px;border-radius:2px;background:rgba(244,232,207,.1);color:var(--cream)}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}
.kpi.fill .delta{background:rgba(0,0,0,.18);color:var(--fill1-ink)}

/* panels */
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mini{display:flex;gap:4px;flex-wrap:wrap}
.mini button{background:transparent;border:1px solid var(--line);border-radius:3px;padding:3px 9px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.mini button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:10px;margin-right:6px;vertical-align:middle}
#chart svg{display:block;width:100%;height:auto}
#chart text{font-family:var(--f-num);font-size:12px;fill:var(--muted)}

/* funnels */
.fun{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fstep{position:relative;margin:0 auto;width:var(--w);min-width:0;background:linear-gradient(90deg,rgba(233,180,76,.16),rgba(242,114,43,.16));border:1px solid var(--line);border-radius:3px;padding:8px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fstep.last{background:var(--fill1-bg);border-color:transparent}
.fstep.last .fl,.fstep.last .fv{color:var(--fill1-ink)}
.fl{font-size:13.5px;color:var(--cream);min-width:0}
.fv{font-family:var(--f-num);font-weight:700;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.fconv{text-align:center;font-size:12px;color:var(--muted);font-family:var(--f-num);letter-spacing:.04em}
.pixrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}
.pstep{background:var(--card2);border:1px solid var(--line);border-radius:3px;padding:12px;position:relative;min-width:0}
.pstep .pv{font-family:var(--f-num);font-weight:700;font-size:30px;color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.pstep .pl{font-size:13px;color:var(--cream);margin-top:4px}
.pstep .pc{font-size:12px;color:var(--muted);margin-top:6px;font-family:var(--f-num);letter-spacing:.04em}
.pstep.last{background:var(--fill1-bg);border-color:transparent}
.pstep.last .pv,.pstep.last .pl,.pstep.last .pc{color:var(--fill1-ink)}
.insight{margin-top:12px;font-size:14px;color:var(--cream);border-left:3px solid var(--lime);padding:4px 0 4px 12px}

/* audience */
.aud{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px}
.agebars{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.agerow{display:grid;grid-template-columns:52px minmax(0,1fr) 92px;gap:10px;align-items:center}
.agerow .a{font-family:var(--f-num);font-weight:600;font-size:14px}
.agerow .bars{display:flex;flex-direction:column;gap:3px}
.agerow .bar{height:9px;border-radius:2px;min-width:2px}
.bar.f{background:var(--orange)} .bar.m{background:var(--gold)} .bar.u{background:rgba(244,232,207,.35)}
.agerow .t{font-family:var(--f-num);font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.gcards{display:grid;grid-template-columns:1fr;gap:10px}
.gcard{background:var(--card2);border:1px solid var(--line);border-radius:3px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.gcard .gn{display:flex;align-items:center;gap:8px;font-weight:600}
.gcard .gn i{width:10px;height:10px;border-radius:2px;display:inline-block}
.gcard .gv{font-family:var(--f-num);font-weight:700;font-size:24px;color:var(--gold);text-align:right;line-height:1}
.gcard .gs{font-size:12px;color:var(--muted);text-align:right;margin-top:3px}

/* table */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:860px;font-size:14px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{border-bottom:1px solid var(--grid);font-family:var(--f-num);font-size:16px}
td:first-child{font-family:var(--f-body);font-size:14px}
tr.best td{background:rgba(198,215,42,.08)}
tr.best td:first-child{box-shadow:inset 3px 0 0 var(--lime)}
.starb{color:var(--lime);margin-left:6px}
tr.cur td:first-child{font-weight:600}
tfoot td{color:var(--muted);border-bottom:0}

/* creatives */
.crs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}
.cr{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:14px;display:grid;grid-template-columns:118px minmax(0,1fr);gap:14px}
.cr .noimg{width:118px;aspect-ratio:9/16;border:1px dashed var(--line);border-radius:3px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;color:var(--muted);font-size:12px}
.sg-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;margin-top:12px}
.srcs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.src .sh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.src .sh b{font-family:var(--f-num);font-weight:600;letter-spacing:.02em;color:var(--cream)}
.src .sh span{font-size:12.5px;color:var(--muted);font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.src .bar{height:10px;background:rgba(244,232,207,.08);border-radius:2px;margin-top:5px;overflow:hidden}
.src .bar i{display:block;height:100%;background:var(--gold);border-radius:2px}
.src.ads .bar i{background:var(--lime)}
.src.ads .sh b{color:var(--lime)}
.chs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ch{border:1px solid var(--line);border-radius:3px;padding:12px}
.ch .cv{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1.05;color:var(--gold);font-variant-numeric:tabular-nums}
.ch .cl{font-family:var(--f-num);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--muted)}
.ch .cs{font-size:12.5px;color:var(--muted);margin-top:4px}
.fsep{text-align:center;font-size:11px;color:var(--lime);font-family:var(--f-num);letter-spacing:.16em;text-transform:uppercase;margin:6px 0 2px}
.fstep.real{background:transparent;border:2px solid var(--lime)}
.fstep.real .fl,.fstep.real .fv{color:var(--lime)}
.cr img{width:118px;aspect-ratio:9/16;object-fit:cover;border-radius:3px;border:1px solid var(--line);max-width:100%}
.cr .rk{font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--gold);line-height:1}
.cr .cn{font-weight:600;margin:4px 0 10px}
.cr .q{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.cr .q div span{display:block;font-size:11.5px;color:var(--muted);font-family:var(--f-num);letter-spacing:.1em;text-transform:uppercase}
.cr .q div b{font-family:var(--f-num);font-size:20px;color:var(--cream)}
.cr .ft{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--grid);padding-top:10px;font-size:13px;color:var(--muted)}
.cr a{color:var(--accent-ink);background:var(--accent);text-decoration:none;font-weight:600;padding:6px 12px;border-radius:3px;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:4px}

/* footer */
footer{margin-top:44px;border-top:1px solid var(--line)}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:22px 34px;font-size:13px;color:var(--muted)}
footer img{width:96px;height:auto}

@media (max-width:900px){
  .hero .wrap{grid-template-columns:1fr}
  .poster{width:min(76%,280px)}
  .tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.aud,.sg-grid{grid-template-columns:1fr}
  .pixrow{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:440px){
  .strip .wrap{flex-direction:column;align-items:flex-start}
  .cr{grid-template-columns:96px minmax(0,1fr)}
  .cr img,.cr .noimg{width:96px}
  .chs{grid-template-columns:1fr}
  .agerow{grid-template-columns:44px minmax(0,1fr) 78px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="strip"><div class="wrap">
  <div class="l caps">Ama Sounds • San Diego, CA</div>
  <div class="r"><span class="caps" data-i="strip_r"></span>
    <div class="flags" role="group" aria-label="Language">

const st = {lang:"pt", tab:"all", preset:"all", cs:null, ce:null, cmp:"none", ks:null, ke:null, line:null, aud:"m_spend"};
try{ const l=localStorage.getItem("jj_lang"); if(l&&T[l]) st.lang=l; else { const n=(navigator.language||"en").slice(0,2); st.lang=T[n]?n:"en"; } }catch(e){ const n=(navigator.language||"en").slice(0,2); st.lang=T[n]?n:"en"; }

const t=(k,v)=>{ let s=T[st.lang][k]; if(s==null) s=T.en[k]??k; if(v) for(const x in v) s=s.split("{"+x+"}").join(v[x]); return s; };

/* ---------- formatting (US) ---------- */
const money=v=>"US$ "+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const int=v=>Math.round(v).toLocaleString("en-US");
const pct=v=>v===0?"0%":(v*100).toFixed(v<0.1?2:1)+"%";
const mdy=s=>{const [y,m,d]=s.split("-");return m+"/"+d+"/"+y;};
const md=s=>{const [y,m,d]=s.split("-");return m+"/"+d;};

/* ---------- dates ---------- */
const TZ = SEED.meta.tz;
const todayLA=()=>new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const toD=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d));};
const toS=d=>d.toISOString().slice(0,10);
const addD=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return toS(d);};
const addM=(s,n)=>{const d=toD(s);const day=d.getUTCDate();d.setUTCDate(1);d.setUTCMonth(d.getUTCMonth()+n);const last=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,last));return toS(d);};
const diffD=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const days=(a,b)=>{const out=[];for(let s=a;s<=b;s=addD(s,1))out.push(s);return out;};

const allDates = SEED.adsets_daily.map(r=>r[0]);
const dataMin = allDates.reduce((a,b)=>a<b?a:b);
const dataMax = SEED.meta.lastDay || allDates.reduce((a,b)=>a>b?a:b);
const anchor = ()=>dataMax;

function range(){
  const end=anchor();
  switch(st.preset){
    case "p7": return [addD(end,-6),end];
    case "p14": return [addD(end,-13),end];
    case "p30": return [addD(end,-29),end];
    case "pm": return [end.slice(0,8)+"01",end];
    case "plm": { const s=addM(end.slice(0,8)+"01",-1); const e=addD(end.slice(0,8)+"01",-1); return [s,e]; }
    case "pc": return [st.cs||dataMin, st.ce||end];
    default: return [dataMin, dataMax];
  }
}
function cmpRange(r){
  if(st.cmp==="prev"){ const n=diffD(r[0],r[1])+1; return [addD(r[0],-n),addD(r[0],-1)]; }
  if(st.cmp==="lm") return [addM(r[0],-1),addM(r[1],-1)];
  if(st.cmp==="custom" && st.ks && st.ke) return [st.ks,st.ke];
  return null;
}

/* ---------- aggregation ---------- */
// adsets_daily: [date, adset, spend, impr, clicks, lpv, atc, ic, pur, rev]
const inR=(d,r)=>d>=r[0]&&d<=r[1];
const keep=a=>st.tab==="all"||a===st.tab;
function agg(r,filterTab=true){
  const o={spend:0,imp:0,clk:0,lpv:0,atc:0,ic:0,pur:0,rev:0,days:new Set()};
  if(!r) return o;
  for(const x of SEED.adsets_daily){ if(!inR(x[0],r)) continue; if(filterTab&&!keep(x[1])) continue;
    o.spend+=x[2];o.imp+=x[3];o.clk+=x[4];o.lpv+=x[5];o.atc+=x[6];o.ic+=x[7];o.pur+=x[8];o.rev+=x[9]; if(x[2]>0) o.days.add(x[0]); }
  return o;
}
function aggBy(r){ const m={}; for(const a of SEED.adsets) m[a.key]={spend:0,imp:0,clk:0,lpv:0,ic:0,pur:0,rev:0};
  for(const x of SEED.adsets_daily){ if(!inR(x[0],r)) continue; const o=m[x[1]]; o.spend+=x[2];o.imp+=x[3];o.clk+=x[4];o.lpv+=x[5];o.ic+=x[7];o.pur+=x[8];o.rev+=x[9]; }
  return m; }
const div=(a,b)=>b>0?a/b:null;

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
const PRESETS=["p7","p14","p30","pm","plm","pall","pc"];
const presetKey=p=>p==="pall"?"all":p;

function renderStatic(){
  document.documentElement.lang=st.lang==="pt"?"pt-BR":st.lang;
  document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=t(el.dataset.i);});
  document.querySelectorAll(".flags button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===st.lang)));
  // updated
  const u=new Date(SEED.meta.updated);
  const utz=st.lang==="pt"?"America/Bahia":"America/Los_Angeles";
  const d=new Intl.DateTimeFormat("en-US",{timeZone:utz,month:"2-digit",day:"2-digit"}).format(u);
  const tm=new Intl.DateTimeFormat(st.lang==="pt"?"pt-BR":"en-US",{timeZone:utz,hour:"numeric",minute:"2-digit",hour12:st.lang!=="pt"}).format(u);
  $("updated").textContent=t("updated",{d,t:tm});
  // countdown
  const n=diffD(todayLA(),SEED.meta.event_date);
  $("countBig").textContent = n>1?t("d_left",{n}):n===1?t("d_tom"):n===0?t("d_today"):t("d_past");
  // presets
  const ps=$("presets"); ps.querySelectorAll("button").forEach(b=>b.remove());
  for(const p of PRESETS){ const b=document.createElement("button"); b.id="pr-"+p; b.textContent=t(p); b.setAttribute("aria-pressed",String(presetKey(p)===st.preset));
    b.onclick=()=>{st.preset=presetKey(p); if(p==="pc"){const r=range(); st.cs=st.cs||dataMin; st.ce=st.ce||r[1];} render();}; ps.appendChild(b); }
  const cs=$("cmpSel"); const cur=st.cmp; cs.innerHTML="";
  for(const [v,k] of [["none","c_none"],["prev","c_prev"],["lm","c_lm"],["custom","c_custom"]]){ const o=document.createElement("option"); o.value=v;o.textContent=t(k); if(v===cur)o.selected=true; cs.appendChild(o); }
  // texture text
  const rep=" AMA SOUNDS ·".repeat(40); $("texT").textContent=rep; $("texB").textContent=rep;
}

const audOf=key=>SEED.adsets.find(a=>a.key===key)||{label:{},sub:{},name:key,code:""};
const audName=key=>{const a=audOf(key);return a.label[st.lang]||a.name;};
function tabMeta(key){ if(key==="all") return {nm:t("all"),sb:t("all_sub"),code:t("all_code")}; const a=audOf(key); return {nm:audName(key),sb:a.sub[st.lang]||"",code:a.code}; }
const purWord=n=>n===1?t("purch1"):t("purchN");

function renderTabs(r){
  const by=aggBy(r); const tot=agg(r,false); const el=$("tabs"); el.innerHTML="";
  for(const key of ["all",...SEED.adsets.map(a=>a.key)]){
    const m=tabMeta(key); const o=key==="all"?tot:by[key];
    const b=document.createElement("button"); b.className="tab"; b.id="tab-"+key; b.setAttribute("role","tab"); b.setAttribute("aria-selected",String(st.tab===key));
    b.innerHTML=`<span class="code">${m.code}</span><span class="nm">${m.nm}</span><span class="sb">${m.sb}</span><span class="res">${int(o.pur)} <small style="font-size:15px;font-weight:600;letter-spacing:.06em">${purWord(o.pur)}</small></span><span class="cost">${money(o.spend)} ${t("spent")} · ${int(o.lpv)} ${t("visits")}</span>`;
    b.onclick=()=>{st.tab=key;render();}; el.appendChild(b);
  }
}

function delta(cur,base,lowerBetter){
  if(base==null) return "";
  if(cur==null) return "";
  if(base===0){ return cur>0?`<span class="delta">${t("new_")}</span>`:""; }
  const ch=(cur-base)/base; if(!isFinite(ch)) return "";
  const good = lowerBetter? ch<0 : ch>0;
  const cls = Math.abs(ch)<0.005?"":(good?"up":"dn");
  return `<span class="delta ${cls}">${ch>0?"▲":"▼"} ${Math.abs(ch*100).toFixed(0)}%</span>`;
}

function renderKPIs(r,cr){
  const a=agg(r), b=cr?agg(cr):null;
  const nd=a.days.size;
  const val=(o,k)=>({spend:o.spend,pur:o.pur,rev:o.rev,roas:div(o.rev,o.spend),cpa:div(o.spend,o.pur),imp:o.imp,clk:o.clk,ctr:div(o.clk,o.imp)})[k];
  const defs=[
    ["spend","k_spend",money(a.spend),t("c_spend",{v:(nd?a.spend/nd:0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}),true,false],
    ["pur","k_pur",int(a.pur),t("c_pur"),true,false],
    ["roas","k_roas",(a.spend>0?(a.rev/a.spend):0).toFixed(2)+"×",t("c_roas"),true,false],
    ["rev","k_rev",money(a.rev),t("c_rev"),false,false],
    ["cpa","k_cpa",a.pur>0?money(a.spend/a.pur):"—",a.pur>0?t("c_cpa"):t("c_cpa0"),false,true],
    ["imp","k_imp",int(a.imp),t("c_imp"),false,false],
    ["clk","k_clk",int(a.clk),t("c_clk"),false,false],
    ["ctr","k_ctr",a.imp>0?pct(a.clk/a.imp):"—",t("c_ctr"),false,false],
  ];
  $("kpis").innerHTML=defs.map(([k,lab,v,cap,fill,low])=>{
    const d=b?delta(val(a,k),val(b,k),low):"";
    return `<div class="kpi${fill?" fill":""}" id="kpi-${k}"><span class="k">${t(lab)}</span><div class="row"><span class="v">${v}</span>${d}</div><span class="c">${cap}</span></div>`;
  }).join("");
}

function nice(max){ if(max<=0) return {max:1,step:.25}; const raw=max/4; const p=Math.pow(10,Math.floor(Math.log10(raw))); const f=raw/p; const s=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; return {max:Math.ceil(max/s)*s,step:s}; }

function renderChart(r,cr){
  const a=agg(r);
  const lines=[["pur","l_pur",8],["lpv","l_lpv",5],["clk","l_clk",4]];
  if(!st.line) st.line = a.pur>0?"pur":"lpv";
  $("lineSel").innerHTML=lines.map(([k,l])=>`<button id="ln-${k}" aria-pressed="${st.line===k}">${t(l)}</button>`).join("");
  lines.forEach(([k])=>{$("ln-"+k).onclick=()=>{st.line=k;render();};});
  const idx=lines.find(x=>x[0]===st.line)[2];
  // active-day window: from first to last date in range that is within data
  const s=r[0]<dataMin?dataMin:r[0], e=r[1]>dataMax?dataMax:r[1];
  const ds = s<=e?days(s,e):[];
  const sp={},mv={};
  for(const x of SEED.adsets_daily){ if(!inR(x[0],r)||!keep(x[1])) continue; sp[x[0]]=(sp[x[0]]||0)+x[2]; mv[x[0]]=(mv[x[0]]||0)+x[idx]; }
  let cmpVals=null;
  if(cr){ const cs=days(cr[0],cr[1]); cmpVals=ds.map((d,i)=>{const cd=cs[i]; if(!cd) return null; let v=0; for(const x of SEED.adsets_daily){ if(x[0]===cd&&keep(x[1])) v+=x[2]; } return v;}); }
  const box=$("chart");
  if(!ds.length){ box.innerHTML=`<div class="empty">${t("empty")}</div>`; $("chartLeg").innerHTML=""; return; }
  const W=Math.max(320,Math.round(box.clientWidth||640)), H=280, L=58, R=44, Tp=16, B=34;
  const iw=W-L-R, ih=H-Tp-B;
  const smax=Math.max(...ds.map(d=>sp[d]||0),...(cmpVals||[]).map(v=>v||0));
  const ms=nice(smax), ml=nice(Math.max(...ds.map(d=>mv[d]||0)));
  const ys=v=>Tp+ih-(v/ms.max)*ih, yl=v=>Tp+ih-(v/ml.max)*ih;
  const bw=iw/ds.length, barW=Math.min(64,bw*.56);
  let g="";
  for(let v=0;v<=ms.max+1e-9;v+=ms.step){ const y=ys(v); g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--grid)"/><text x="${L-8}" y="${y+4}" text-anchor="end">$${v%1?v.toFixed(2):v}</text>`; }
  for(let v=0;v<=ml.max+1e-9;v+=ml.step){ const y=yl(v); g+=`<text x="${W-R+8}" y="${y+4}" text-anchor="start">${v%1?v.toFixed(1):v}</text>`; }
  let bars="",pts=[],labels="",step=Math.ceil(ds.length/10);
  ds.forEach((d,i)=>{ const cx=L+bw*i+bw/2; const v=sp[d]||0; const y=ys(v);
    bars+=`<rect x="${cx-barW/2}" y="${y}" width="${barW}" height="${Tp+ih-y}" fill="var(--bar)" rx="2"><title>${md(d)} · ${money(v)}</title></rect>`;
    if(ds.length<=7 && v>0) bars+=`<text x="${cx}" y="${y-6}" text-anchor="middle" style="fill:var(--cream)">$${v.toFixed(2)}</text>`;
    pts.push([cx,yl(mv[d]||0),mv[d]||0]);
    if(i%step===0) labels+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${md(d)}</text>`; });
  const path=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  let cmpPath="";
  if(cmpVals){ const cp=cmpVals.map((v,i)=>v==null?null:[L+bw*i+bw/2,ys(v)]).filter(Boolean); if(cp.length) cmpPath=`<path d="${cp.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ")}" fill="none" stroke="var(--cream)" stroke-width="1.6" stroke-dasharray="5 5" opacity=".7"/>`; }
  const dots=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--bg)" stroke="var(--lineC)" stroke-width="2.5"><title>${int(p[2])}</title></circle>`).join("");
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("chart_t")}">${g}${bars}${cmpPath}<path d="${path}" fill="none" stroke="var(--lineC)" stroke-width="2.5"/>${dots}${labels}</svg>`;
  $("chartLeg").innerHTML=`<span><i style="background:var(--bar)"></i>${t("leg_spend")}</span><span><i style="background:var(--lineC);height:3px"></i>${t(lines.find(x=>x[0]===st.line)[1])}</span>${cmpVals?`<span><i style="border-top:2px dashed var(--cream);height:0"></i>${t("leg_cmp")}</span>`:""}`;
}

/* ---------- Shotgun (vendas reais) ---------- */
// SG.orders: {d, t (ingressos), face, paid, src (UTM SOURCE), ch (app|website)}
// UTMs dos anúncios: "ads" (todos os públicos), "ads-prosp" (público novo), "ads-quente" (remarketing)
const ADS_TAB={"ads-prosp":"novo","ads-quente":"rmkt"};
const isAds=s=>s==="ads"||s.startsWith("ads-");
const srcGroup=s=>isAds(s)?"ads":s;
const sgOrders=r=>(SG&&SG.orders||[]).filter(o=>inR(o.d,r));
const adsOrders=r=>sgOrders(r).filter(o=>isAds(o.src)&&(st.tab==="all"||ADS_TAB[o.src]===st.tab));
const sum=(l,k)=>l.reduce((t,o)=>t+o[k],0);
const pw=n=>n===1?t("ped1"):t("pedN"), iw=n=>n===1?t("ing1"):t("ingN");
function renderShotgun(r){
  if(!SG||!SG.orders){ $("sgSec").hidden=true; return; }
  $("sgSec").hidden=false;
  const L=sgOrders(r), A=adsOrders(r);
  const o=L.length, tk=sum(L,"t"), paid=sum(L,"paid"), face=sum(L,"face");
  const at=sum(A,"t"), spend=agg(r).spend;
  $("sgPer").textContent=t("sg_per",{a:mdy(r[0]),b:mdy(r[1]),u:mdy(SG.updated)});
  const defs=[
    ["ord","sg_ord",int(o),t("c_ord",{n:int(sgOrders(r).filter(x=>isAds(x.src)).length)}),false],
    ["tix","sg_tix",int(tk),t("c_tix",{n:o?(tk/o).toFixed(1):"0"}),false],
    ["rev","sg_rev",money(paid),t("c_sgrev",{f:money(face)}),false],
    ["cpt","sg_cpt",at>0?money(spend/at):"—",at>0?t("c_cpt",{n:int(at),ing:iw(at)}):t(st.tab==="all"?"c_cpt0":"c_cpt0t"),true],
  ];
  $("sgKpis").innerHTML=defs.map(([k,lab,v,cap,fill])=>`<div class="kpi${fill?" fill":""}" id="sg-${k}"><span class="k">${t(lab)}</span><div class="row"><span class="v">${v}</span></div><span class="c">${cap}</span></div>`).join("");
  if(!o){ $("sgSrc").innerHTML=`<div class="empty">${t("sg_empty")}</div>`; $("sgCh").innerHTML=""; return; }
  const g={}; for(const x of L){ const k=srcGroup(x.src); const e=g[k]=g[k]||{o:0,t:0,v:0}; e.o++; e.t+=x.t; e.v+=x.paid; }
  const rows=Object.entries(g).sort((a,b)=>b[1].t-a[1].t||b[1].o-a[1].o); const mx=Math.max(...rows.map(([,e])=>e.t));
  $("sgSrc").innerHTML=rows.map(([k,e])=>`<div class="src ${k==="ads"?"ads":""}" id="src-${k}"><div class="sh"><b>${T[st.lang]["src_"+k]||k}</b><span>${t("src_line",{o:int(e.o),ped:pw(e.o),t:int(e.t),ing:iw(e.t),v:money(e.v)})}</span></div><div class="bar"><i style="width:${(e.t/mx*100).toFixed(1)}%"></i></div></div>`).join("");
  $("sgCh").innerHTML=["app","website"].map(c=>{ const l=L.filter(x=>x.ch===c), n=l.length, tt=sum(l,"t");
    return `<div class="ch" id="ch-${c}"><div class="cl">${t("ch_"+c)}</div><div class="cv">${int(n)} <small style="font-size:15px;color:var(--muted)">${pw(n)}</small></div><div class="cs">${t("ch_line",{t:int(tt),ing:iw(tt),v:money(sum(l,"paid"))})}</div><div class="cs">${pct(n/o)}</div></div>`; }).join("");
}

function renderFunnels(r){
  const a=agg(r);
  const steps=[["f_imp",a.imp],["f_clk",a.clk],["f_lpv",a.lpv],["f_ic",a.ic],["f_pur",a.pur]];
  const w=[100,86,72,60,50];
  $("funC").innerHTML=steps.map(([k,v],i)=>{
    const conv=i?`<div class="fconv">↓ ${steps[i-1][1]>0?pct(v/steps[i-1][1]):"—"}</div>`:"";
    return conv+`<div class="fstep${i===steps.length-1&&!SG?" last":""}" style="--w:${w[i]}%"><span class="fl">${t(k)}</span><span class="fv">${int(v)}</span></div>`;
  }).join("")+(SG&&SG.orders?(()=>{ const A=adsOrders(r), n=A.length, tk=sum(A,"t");
    return `<div class="fsep">${t("f_sep")}</div><div class="fstep real" id="f-real" style="--w:72%"><span class="fl">${t("f_real")}<br><small style="font-size:12px;opacity:.85">${int(n)} ${pw(n)} · ${int(tk)} ${iw(tk)}</small></span><span class="fv">${int(n)}</span></div>`; })():"");
  const px={pv:0,atc:0,ic:0,pur:0};
  for(const x of SEED.pixel_daily){ if(!inR(x[0],r)) continue; px.pv+=x[1];px.atc+=x[2];px.ic+=x[3];px.pur+=x[4]; }
  const ps=[["p_pv",px.pv],["p_atc",px.atc],["p_ic",px.ic],["p_pur",px.pur]];
  $("funP").innerHTML=ps.map(([k,v],i)=>`<div class="pstep${i===ps.length-1?" last":""}"><div class="pv">${int(v)}</div><div class="pl">${t(k)}</div><div class="pc">${i?t("of_prev",{p:ps[i-1][1]>0?pct(v/ps[i-1][1]):"—"}):"&nbsp;"}</div></div>`).join("");
  const all=agg(r,false);
  $("pixIns").textContent=t("pix_ins",{p:int(px.pur),compras:purWord(px.pur),a:int(all.pur),atrib:all.pur===1?t("atrib1"):t("atribN")});
}

const AGES=["18-24","25-34","35-44","45-54","55-64","65+"];
function renderAudience(r){
  const tot=agg(r);
  $("audTitle").textContent= tot.pur>0?t("aud_buy"):t("aud_arr");
  const ms=[["m_spend",4],["m_imp",5],["m_clk",6],["m_lpv",7],["m_pur",8]];
  $("audSel").innerHTML=ms.map(([k])=>`<button id="au-${k}" aria-pressed="${st.aud===k}">${t(k)}</button>`).join("");
  ms.forEach(([k])=>{$("au-"+k).onclick=()=>{st.aud=k;render();};});
  const mi=ms.find(x=>x[0]===st.aud)[1];
  // demo: [date, adset, age, g, spend, impr, clicks, lpv, pur, rev]
  const cell={}; const gt={f:{s:0,l:0,v:0},m:{s:0,l:0,v:0},u:{s:0,l:0,v:0}}; const ageT={};
  for(const x of SEED.demo_daily){ if(!inR(x[0],r)||!keep(x[1])) continue;
    const k=x[2]+"|"+x[3]; cell[k]=(cell[k]||0)+x[mi];
    gt[x[3]].s+=x[4]; gt[x[3]].l+=x[7];
    ageT[x[2]]=ageT[x[2]]||{s:0,l:0,p:0}; ageT[x[2]].s+=x[4]; ageT[x[2]].l+=x[7]; ageT[x[2]].p+=x[8]; }
  const fmt=st.aud==="m_spend"?money:int;
  const mx=Math.max(0.0001,...Object.values(cell));
  $("ageBars").innerHTML=AGES.map(a=>{ const f=cell[a+"|f"]||0,m=cell[a+"|m"]||0,u=cell[a+"|u"]||0;
    return `<div class="agerow"><span class="a">${a}</span><div class="bars"><div class="bar f" style="width:${f/mx*100}%" title="${t("g_f")}: ${fmt(f)}"></div><div class="bar m" style="width:${m/mx*100}%" title="${t("g_m")}: ${fmt(m)}"></div>${u>0?`<div class="bar u" style="width:${u/mx*100}%" title="${t("g_u")}: ${fmt(u)}"></div>`:""}</div><span class="t">${fmt(f+m+u)}</span></div>`; }).join("");
  const ts=gt.f.s+gt.m.s+gt.u.s;
  $("gCards").innerHTML=[["f","g_f","var(--orange)"],["m","g_m","var(--gold)"],["u","g_u","rgba(244,232,207,.35)"]].map(([g,l,c])=>`<div class="gcard" id="g-${g}"><span class="gn"><i style="background:${c}"></i>${t(l)}</span><div><div class="gv">${money(gt[g].s)}</div><div class="gs">${t("g_share",{s:ts>0?pct(gt[g].s/ts):"—",v:int(gt[g].l)})}</div></div></div>`).join("");
  let best=null;
  const usePur=tot.pur>0;
  for(const a of AGES){ const o=ageT[a]; if(!o) continue; const n=usePur?o.p:o.l; if(n>0){ const c=o.s/n; if(!best||c<best[1]) best=[a,c]; } }
  $("audIns").textContent= best? t(usePur?"ins_pur":"ins_lpv",{a:best[0],v:money(best[1])}) : "";
  $("audIns").hidden=!best;
}

function renderTable(r){
  const by=aggBy(r), tot=agg(r,false);
  const usePur=tot.pur>0;
  let best=null;
  for(const a of SEED.adsets){ const o=by[a.key]; const n=usePur?o.pur:o.lpv; if(n>0){ const c=o.spend/n; if(!best||c<best[1]) best=[a.key,c]; } }
  $("cmpSub").textContent= best? t(usePur?"cmp_star_pur":"cmp_star_lpv"):"";
  const row=(nm,o,cls,star)=>`<tr class="${cls}"><td>${nm}${star?'<span class="starb">★</span>':""}</td><td>${money(o.spend)}</td><td>${int(o.imp)}</td><td>${o.imp?pct(o.clk/o.imp):"—"}</td><td>${int(o.lpv)}</td><td>${o.lpv?money(o.spend/o.lpv):"—"}</td><td>${int(o.ic)}</td><td>${int(o.pur)}</td><td>${o.pur?money(o.spend/o.pur):"—"}</td><td>${o.spend?(o.rev/o.spend).toFixed(2)+"×":"—"}</td></tr>`;
  const head=`<thead><tr>${["t_aud","t_spend","t_imp","t_ctr","t_lpv","t_cplpv","t_ic","t_pur","t_cpa","t_roas"].map(k=>`<th>${t(k)}</th>`).join("")}</tr></thead>`;
  const body=SEED.adsets.filter(a=>by[a.key].spend>0).sort((x,y)=>by[y.key].spend-by[x.key].spend).map(a=>row(audName(a.key),by[a.key],[best&&best[0]===a.key?"best":"",st.tab===a.key?"cur":""].join(" "),best&&best[0]===a.key)).join("");
  $("cmpTbl").innerHTML= body? head+`<tbody>${body}</tbody><tfoot>${row(t("t_total"),tot,"",false)}</tfoot>` : `<tbody><tr><td class="empty" colspan="10">${t("empty")}</td></tr></tbody>`;
}

function renderCreatives(r){
  // ads_daily: [date, adset, creative, spend, impr, clicks, lpv, ic, pur, rev]
  const m={};
  for(const x of SEED.ads_daily){ if(!inR(x[0],r)||!keep(x[1])) continue; const o=m[x[2]]=m[x[2]]||{s:0,i:0,c:0,l:0,p:0,v:0}; o.s+=x[3];o.i+=x[4];o.c+=x[5];o.l+=x[6];o.p+=x[8];o.v+=x[9]; }
  const list=Object.entries(m).filter(([,o])=>o.s>0);
  const usePur=list.some(([,o])=>o.p>0);
  $("crSub").textContent=t(usePur?"cr_sub_pur":"cr_sub_lpv");
  const cost=o=>{const n=usePur?o.p:o.l; return n>0?o.s/n:Infinity;};
  list.sort((a,b)=>cost(a[1])-cost(b[1])||b[1].s-a[1].s);
  if(!list.length){ $("crs").innerHTML=`<div class="empty">${t("empty")}</div>`; return; }
  $("crs").innerHTML=list.map(([k,o],i)=>{ const c=SEED.creatives[k];
    return `<article class="cr" id="cr-${k}">${c.thumb?`<img src="${c.thumb}" alt="${c.label[st.lang]||c.name}">`:`<div class="noimg">${t("no_thumb")}</div>`}<div><div class="rk">${T[st.lang].rank[i]||(i+1)}</div><div class="cn">${c.label[st.lang]||c.name}</div>
     <div class="q"><div><span>${t("q_pur")}</span><b>${int(o.p)}</b></div><div><span>${t("q_cpa")}</span><b>${o.p?money(o.s/o.p):"—"}</b></div><div><span>${t("q_lpv")}</span><b>${int(o.l)}</b></div><div><span>${t("q_ctr")}</span><b>${o.i?pct(o.c/o.i):"—"}</b></div></div></div>
     <div class="ft"><span>${t("cr_ft",{s:money(o.s),i:int(o.i)})}</span>${c.preview?`<a href="${c.preview}" target="_blank" rel="noopener">${t("cr_btn")}</a>`:""}</div></article>`; }).join("");
}

function render(){
  renderStatic();
  const r=range(); const cr=cmpRange(r);
  $("customBox").hidden = st.preset!=="pc"; $("cmpBox").hidden = st.cmp!=="custom";
  if(st.preset==="pc"){ $("cStart").value=r[0]; $("cEnd").value=r[1]; }
  renderTabs(r);
  const m=tabMeta(st.tab); $("tabTitle").textContent=m.nm; $("tabTag").textContent=m.code;
  const a=agg(r); const nd=a.days.size;
  $("tabPer").textContent=t("per_lbl",{a:mdy(r[0]),b:mdy(r[1]),n:nd,dias:nd===1?t("day1"):t("dayN")})+(cr?" · "+t("vs",{p:mdy(cr[0])+" – "+mdy(cr[1])}):"");
  renderKPIs(r,cr); renderShotgun(r); renderChart(r,cr); renderFunnels(r); renderAudience(r); renderTable(r); renderCreatives(r);
}

/* ---------- events ---------- */
document.querySelectorAll(".flags button").forEach(b=>b.onclick=()=>{st.lang=b.dataset.lang; try{localStorage.setItem("jj_lang",st.lang);}catch(e){} render();});
$("cStart").onchange=e=>{st.cs=e.target.value;render();}; $("cEnd").onchange=e=>{st.ce=e.target.value;render();};
$("cmpSel").onchange=e=>{st.cmp=e.target.value; if(st.cmp==="custom"&&!st.ks){const r=range(); const n=diffD(r[0],r[1])+1; st.ks=addD(r[0],-n); st.ke=addD(r[0],-1); $("kStart").value=st.ks; $("kEnd").value=st.ke;} render();};
$("kStart").onchange=e=>{st.ks=e.target.value;render();}; $("kEnd").onchange=e=>{st.ke=e.target.value;render();};
let rz; window.addEventListener("resize",()=>{clearTimeout(rz); rz=setTimeout(()=>renderChart(range(),cmpRange(range())),120);});
render();
}
Promise.all([
  fetch("data.json",{cache:"no-store"}).then(r=>{if(!r.ok) throw new Error(r.status); return r.json();}),
  fetch("shotgun.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)
]).then(([d,sg])=>boot(d,sg)).catch(()=>{
  const m=document.createElement("p"); m.className="empty"; m.style.margin="24px auto"; m.textContent="Não foi possível carregar os dados agora. Recarregue a página em alguns minutos.";
  document.querySelector("main").prepend(m);
});
</script>
